<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Realtime Monitor</title>
  <!-- Tailwind CSS & Chart.js & Supabase CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-lg">
      <div class="flex items-center space-x-3">
        <span class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="text-xl font-bold text-slate-100">MT5 Monitor <span id="acc-num" class="text-slate-400 text-sm font-normal">#160087856</span></h1>
      </div>
      <span id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        Status: Connected
      </span>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <!-- Balance -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700/80 shadow">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">BALANCE</p>
        <p id="val-balance" class="text-2xl md:text-3xl font-bold mt-2 text-white">$0.00</p>
      </div>
      <!-- Equity -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700/80 shadow">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">EQUITY</p>
        <p id="val-equity" class="text-2xl md:text-3xl font-bold mt-2 text-sky-400">$0.00</p>
      </div>
      <!-- Daily Profit -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700/80 shadow">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">PROFIT HARI INI</p>
        <p id="val-profit" class="text-2xl md:text-3xl font-bold mt-2 text-emerald-400">+$0.00</p>
      </div>
      <!-- Percentage -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700/80 shadow">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">PERSENTASE HARIAN</p>
        <p id="val-percent" class="text-2xl md:text-3xl font-bold mt-2 text-emerald-400">+0.00%</p>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700/80 shadow space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-semibold text-slate-200">Grafik Pertumbuhan Equity Intraday</h2>
        <span class="text-xs text-slate-400">Pembaruan Real-time</span>
      </div>
      <div class="h-64 relative">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // Config Supabase
    const SUPABASE_URL = "https://naadmqzcirevppkzydfz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wxTw0nlh-ZBuNSbKhfk1rw_S_SdXA92; // <-- Masukkan Anon Key Supabase di sini
    const TARGET_ACCOUNT = 160087856;

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Chart Setup
    const ctx = document.getElementById('equityChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Equity ($)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3,
          pointRadius: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
        },
        plugins: { legend: { display: false } }
      }
    });

    // Fetch Data Function
    async function fetchData() {
      const { data, error } = await supabase
        .from('account_snapshots')
        .select('*')
        .eq('account_number', TARGET_ACCOUNT)
        .order('created_at', { ascending: false })
        .limit(30);

      if (error) {
        console.error('Error Supabase:', error);
        return;
      }

      if (data && data.length > 0) {
        const latest = data[0];
        document.getElementById('val-balance').textContent = `$${Number(latest.balance).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        document.getElementById('val-equity').textContent = `$${Number(latest.equity).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        
        const profit = Number(latest.daily_profit_nominal || 0);
        const percent = Number(latest.daily_profit_percent || 0);
        
        const profitEl = document.getElementById('val-profit');
        profitEl.textContent = `${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}`;
        profitEl.className = `text-2xl md:text-3xl font-bold mt-2 ${profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

        const percentEl = document.getElementById('val-percent');
        percentEl.textContent = `${percent >= 0 ? '+' : ''}${percent.toFixed(2)}%`;
        percentEl.className = `text-2xl md:text-3xl font-bold mt-2 ${percent >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

        // Update Chart
        const historyData = [...data].reverse();
        chart.data.labels = historyData.map(row => new Date(row.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        chart.data.datasets[0].data = historyData.map(row => row.equity);
        chart.update();
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
