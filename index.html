<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Realtime Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* Header */
    .header { background-color: #1e293b; padding: 16px 24px; border-radius: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header-title { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: bold; }
    .dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
    .select-box { display: flex; align-items: center; gap: 10px; }
    select { background-color: #0f172a; color: #fff; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; outline: none; }
    
    /* Grid Stats */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .card-label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.75rem; font-weight: bold; margin-top: 8px; }
    
    .text-sky { color: #38bdf8; }
    .text-green { color: #10b981; }
    .text-red { color: #f43f5e; }
    
    /* Chart Container */
    .chart-card { background-color: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 16px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; }
    .chart-container { position: relative; height: 320px; width: 100%; }

    /* Table Positions */
    .table-card { background-color: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    th { padding: 12px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid #334155; }
    td { padding: 12px; border-bottom: 1px solid #334155/60; }
    .badge-buy { background-color: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; }
    .badge-sell { background-color: rgba(244, 63, 94, 0.2); color: #f43f5e; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header & Dropdown Akun -->
    <div class="header">
      <div class="header-title">
        <div class="dot"></div>
        <span>MT5 Monitor</span>
      </div>
      <div class="select-box">
        <label for="accountSelect" style="font-size: 0.85rem; color: #94a3b8;">Pilih Akun:</label>
        <select id="accountSelect" onchange="onAccountChange()">
          <option value="">Memuat daftar akun...</option>
        </select>
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="grid">
      <div class="card">
        <div class="card-label">BALANCE</div>
        <div id="val-balance" class="stat-value">$0.00</div>
      </div>
      <div class="card">
        <div class="card-label">EQUITY</div>
        <div id="val-equity" class="stat-value text-sky">$0.00</div>
      </div>
      <div class="card">
        <div class="card-label">PROFIT HARI INI</div>
        <div id="val-profit" class="stat-value text-green">+$0.00</div>
      </div>
      <div class="card">
        <div class="card-label">PERSENTASE HARIAN</div>
        <div id="val-percent" class="stat-value text-green">+0.00%</div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 style="font-size: 1rem; color: #e2e8f0;">Grafik Pertumbuhan Equity Intraday</h3>
        <span style="font-size: 0.75rem; color: #94a3b8;">Pembaruan Real-time</span>
      </div>
      <div class="chart-container">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

    <!-- Table Open Positions -->
    <div class="table-card">
      <h3 style="font-size: 1rem; color: #e2e8f0; margin-bottom: 16px;">Transaksi Aktif (Open Positions)</h3>
      <table>
        <thead>
          <tr>
            <th>Ticket</th>
            <th>Symbol</th>
            <th>Tipe</th>
            <th>Lot</th>
            <th>Harga Open</th>
            <th>SL</th>
            <th>TP</th>
            <th>Profit ($)</th>
          </tr>
        </thead>
        <tbody id="positionsTable">
          <tr>
            <td colspan="8" style="text-align: center; color: #94a3b8;">Memuat transaksi aktif...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://naadmqzcirevppkzydfz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wxTw0nlh-ZBuNSbKhfk1rw_S_SdXA92";

    let selectedAccount = null;

    // Chart.js Setup
    const ctx = document.getElementById('equityChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Equity ($)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
        },
        plugins: { legend: { display: false } }
      }
    });

    async function loadAccounts() {
      const selectEl = document.getElementById('accountSelect');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/account_snapshots?select=account_number&order=updated_at.desc&limit=100`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });

        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const data = await res.json();

        if (!data || data.length === 0) {
          selectEl.innerHTML = '<option value="">Data masih kosong</option>';
          return;
        }

        const uniqueAccounts = [...new Set(data.map(item => item.account_number))];
        const currentChoice = selectedAccount;
        selectEl.innerHTML = '';

        uniqueAccounts.forEach(acc => {
          const option = document.createElement('option');
          option.value = acc;
          option.textContent = `Akun #${acc}`;
          if (currentChoice && currentChoice == acc) option.selected = true;
          selectEl.appendChild(option);
        });

        if (!selectedAccount && uniqueAccounts.length > 0) {
          selectedAccount = uniqueAccounts[0];
        }

        fetchData();
        fetchPositions();
      } catch (err) {
        selectEl.innerHTML = `<option value="">Error: ${err.message}</option>`;
      }
    }

    function onAccountChange() {
      const selectEl = document.getElementById('accountSelect');
      selectedAccount = selectEl.value;
      fetchData();
      fetchPositions();
    }

    async function fetchData() {
      if (!selectedAccount) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/account_snapshots?account_number=eq.${selectedAccount}&order=updated_at.desc&limit=30`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });

        if (!res.ok) return;
        const data = await res.json();
        if (!data || data.length === 0) return;

        const latest = data[0];
        document.getElementById('val-balance').textContent = `$${Number(latest.balance).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        document.getElementById('val-equity').textContent = `$${Number(latest.equity).toLocaleString('en-US', {minimumFractionDigits: 2})}`;

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayISO = today.toISOString();

        const resToday = await fetch(`${SUPABASE_URL}/rest/v1/account_snapshots?account_number=eq.${selectedAccount}&updated_at=gte.${todayISO}&order=updated_at.asc&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });

        let startBalance = Number(latest.balance);
        if (resToday.ok) {
          const todayData = await resToday.json();
          if (todayData && todayData.length > 0) {
            startBalance = Number(todayData[0].balance);
          } else {
            startBalance = Number(data[data.length - 1].balance);
          }
        }

        const currentEquity = Number(latest.equity);
        const profit = currentEquity - startBalance;
        const percent = startBalance > 0 ? (profit / startBalance) * 100 : 0;
        
        const profitEl = document.getElementById('val-profit');
        profitEl.textContent = `${profit >= 0 ? '+' : ''}$${profit.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        profitEl.className = `stat-value ${profit >= 0 ? 'text-green' : 'text-red'}`;

        const percentEl = document.getElementById('val-percent');
        percentEl.textContent = `${percent >= 0 ? '+' : ''}${percent.toFixed(2)}%`;
        percentEl.className = `stat-value ${percent >= 0 ? 'text-green' : 'text-red'}`;

        const historyData = [...data].reverse();
        chart.data.labels = historyData.map(row => new Date(row.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        chart.data.datasets[0].data = historyData.map(row => row.equity);
        chart.update();
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchPositions() {
      if (!selectedAccount) return;

      const posTableBody = document.getElementById('positionsTable');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/open_positions?account_number=eq.${selectedAccount}&order=ticket.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });

        if (!res.ok) return;
        const positions = await res.json();

        if (!positions || positions.length === 0) {
          posTableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #94a3b8;">Tidak ada transaksi aktif (0 posisi open)</td></tr>';
          return;
        }

        posTableBody.innerHTML = '';
        positions.forEach(pos => {
          const p = Number(pos.profit || 0);
          const pClass = p >= 0 ? 'text-green' : 'text-red';
          const typeBadge = pos.type.toUpperCase() === 'BUY' ? '<span class="badge-buy">BUY</span>' : '<span class="badge-sell">SELL</span>';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>#${pos.ticket}</td>
            <td><strong>${pos.symbol}</strong></td>
            <td>${typeBadge}</td>
            <td>${Number(pos.volume).toFixed(2)}</td>
            <td>${Number(pos.open_price).toFixed(2)}</td>
            <td>${Number(pos.sl || 0).toFixed(2)}</td>
            <td>${Number(pos.tp || 0).toFixed(2)}</td>
            <td class="${pClass}"><strong>${p >= 0 ? '+' : ''}$${p.toFixed(2)}</strong></td>
          `;
          posTableBody.appendChild(row);
        });
      } catch (err) {
        console.error('Error positions:', err);
      }
    }

    loadAccounts();
    setInterval(loadAccounts, 10000);
    setInterval(fetchData, 5000);
    setInterval(fetchPositions, 5000);
  </script>
</body>
</html>
