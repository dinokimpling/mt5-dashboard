<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MT5 Trading Monitor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0F172A',
            cardbg: '#1E293B',
            accentgreen: '#22C55E',
            accentred: '#EF4444'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans pb-12">

  <!-- Header / Navbar -->
  <header class="border-b border-slate-800 bg-cardbg/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-accentgreen animate-pulse"></div>
        <h1 class="text-xl font-bold tracking-wide">MT5 Monitor <span class="text-xs text-slate-400 font-normal">#12345678</span></h1>
      </div>
      <span class="text-xs px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-slate-300">
        Status: <strong class="text-accentgreen">Connected</strong>
      </span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

    <!-- Ringkasan Statistik (Stat Cards) -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-cardbg p-5 rounded-2xl border border-slate-800">
        <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Balance</p>
        <h2 id="val-balance" class="text-2xl md:text-3xl font-extrabold mt-1">$0.00</h2>
      </div>
      <div class="bg-cardbg p-5 rounded-2xl border border-slate-800">
        <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Equity</p>
        <h2 id="val-equity" class="text-2xl md:text-3xl font-extrabold text-blue-400 mt-1">$0.00</h2>
      </div>
      <div class="bg-cardbg p-5 rounded-2xl border border-slate-800">
        <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Profit Hari Ini</p>
        <h2 id="val-profit-nominal" class="text-2xl md:text-3xl font-extrabold text-accentgreen mt-1">+$0.00</h2>
      </div>
      <div class="bg-cardbg p-5 rounded-2xl border border-slate-800">
        <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Persentase Harian</p>
        <h2 id="val-profit-percent" class="text-2xl md:text-3xl font-extrabold text-accentgreen mt-1">+0.00%</h2>
      </div>
    </div>

    <!-- Grafik Pergerakan Equity -->
    <div class="bg-cardbg p-5 rounded-2xl border border-slate-800">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-semibold">Grafik Pertumbuhan Equity Intraday</h3>
        <span class="text-xs text-slate-400">Pembaruan Real-time</span>
      </div>
      <div class="h-64">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

    <!-- Posisi Terbuka -->
    <div class="bg-cardbg rounded-2xl border border-slate-800 overflow-hidden">
      <div class="border-b border-slate-800 p-4 flex gap-4">
        <button class="text-sm font-semibold text-blue-400 border-b-2 border-blue-400 pb-1">Posisi Terbuka</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-[11px] tracking-wider">
            <tr>
              <th class="p-4">Ticket</th>
              <th class="p-4">Pair</th>
              <th class="p-4">Tipe</th>
              <th class="p-4">Lot</th>
              <th class="p-4">Harga Buka</th>
              <th class="p-4">Harga Sekarang</th>
              <th class="p-4 text-right">Profit ($)</th>
            </tr>
          </thead>
          <tbody id="open-positions-list" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="7" class="p-4 text-center text-slate-500">Menunggu data dari MT5...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // 1. SETUP GRAFIK
    const ctx = document.getElementById('equityChart').getContext('2d');
    const equityChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00', 'Sekarang'],
        datasets: [{
          label: 'Equity ($)',
          data: [0, 0, 0, 0, 0, 0, 0],
          borderColor: '#3B82F6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } }
        }
      }
    });

    // 2. KONEKSI SUPABASE (GANTI DUA BARIS DI BAWAH INI DENGAN CATATAN NOTES ANDA)
    const SUPABASE_URL = 'sb_publishable_wxTw0nlh-ZBuNSbKhfk1rw_S_SdXA92';
    const SUPABASE_ANON_KEY = 'https://naadmqzcirevppkzydfz.supabase.co/rest/v1/';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. AMBIL DATA SNAPSHOT REALTIME
    async function fetchTradingData() {
      const { data: snapshots } = await supabaseClient
        .from('account_snapshots')
        .select('*')
        .order('updated_at', { ascending: false })
        .limit(1);

      if (snapshots && snapshots.length > 0) {
        const data = snapshots[0];
        document.getElementById('val-balance').innerText = '$' + Number(data.balance).toLocaleString();
        document.getElementById('val-equity').innerText = '$' + Number(data.equity).toLocaleString();
        document.getElementById('val-profit-nominal').innerText = (data.daily_profit_nominal >= 0 ? '+$' : '-$') + Math.abs(data.daily_profit_nominal);
        document.getElementById('val-profit-percent').innerText = (data.daily_profit_percent >= 0 ? '+' : '') + data.daily_profit_percent + '%';
      }
    }

    fetchTradingData();

    // Subscribe perubahan realtime Supabase
    supabaseClient
      .channel('schema-db-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'account_snapshots' }, payload => {
        fetchTradingData();
      })
      .subscribe();
  </script>
</body>
</html>
